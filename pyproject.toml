[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docpulse"
version = "0.1.0"
description = "A modern CLI tool for intelligent document analysis, section breakdown, and study guide generation."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "DocPulse Contributors" }
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "pypdf>=4.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
docpulse = "docpulse.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/docpulse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# E4/E7/E9/F match ruff's own unconfigured defaults; I/UP/B/S add import
# sorting, modern-syntax, bugbear and basic security checks. E501 (line length)
# is intentionally left out - console markup strings and LLM prompt text are
# naturally long and wrapping them hurts readability more than it helps.
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "S"]
ignore = [
    # Typer's documented pattern is `typer.Argument(...)` / `typer.Option(...)`
    # as parameter defaults; there is no idiomatic alternative.
    "B008",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S106"]
